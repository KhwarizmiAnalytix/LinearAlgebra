# Host config for coverage-tool
# https://github.com/KhwarizmiAnalytix/coverage-tool

[coverage]
filter = "."
source_folder = "."
output_format = "html-and-json"
coverage_report_dir = "coverage_report"
# Without this, coverage-tool's discover_modules() treats every immediate
# source subdirectory (include/) as its own "module", each
# expected to have its own lib<module>.* + <module>CxxTests binary (XSigma's
# per-module Library/<Name> convention). LinearAlgebra builds one flat
# libLinearAlgebra.* + LinearAlgebraCxxTests, so on the Clang/LLVM coverage
# path this silently produced "Library not found for module X, skipping" for
# every subdirectory and an empty report. The GCC/lcov backend ignores
# `modules` entirely (whole-build-dir capture), which is why CI (gcc) never
# caught this.
modules = ["LinearAlgebra"]

[coverage.exclude]
patterns = [
    "*ThirdParty*",
    "*Testing*",
    "/usr/*",
]
llvm_ignore_regex = [
    ".*Testing[/\\\\].*",
    ".*ThirdParty[/\\\\].*",
]

[coverage.gcc]
# lcov 2.x treats an exclude pattern that matched nothing in a given run as an
# error ("'exclude' pattern '*Testing*' is unused") instead of a no-op; add
# "unused" to coverage-tool's default ignore list so a backend/compiler combo
# that happens not to touch ThirdParty/Testing paths (e.g. this module's flat
# layout) doesn't fail CI over it.
lcov_ignore_errors = ["mismatch", "negative", "gcov", "unused"]
