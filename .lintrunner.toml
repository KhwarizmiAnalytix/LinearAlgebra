# Host menu for lint-tool (https://github.com/KhwarizmiAnalytix/lint-tool).
# Adapters live in the package; this file is policy (which linters, globs).
# Menu is the Logging/Parallel-sized set from lint-tool's README.

[[linter]]
code = 'CLANGFORMAT'
include_patterns = [
    '**/*.h',
    '**/*.hxx',
    '**/*.hpp',
    '**/*.cpp',
    '**/*.cxx',
    '**/*.cc',
    '**/*.cu',
    '**/*.cuh',
    '**/*.mm',
]
exclude_patterns = [
    'ThirdParty/**',
    '**/third_party/**',
    '**/bespoke/**',
    'build/**',
    'build_*/**',
    '.lintbin/**',
    '.git/**',
]
init_command = [
    'python3',
    'Scripts/lintrunner_init_clang_format.py',
    '--dry-run={{DRYRUN}}',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.clangformat_linter',
    '--binary=.lintbin/clang-format',
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'CMAKE'
include_patterns = [
    '**/*.cmake',
    '**/*.cmake.in',
    '**/CMakeLists.txt',
]
exclude_patterns = [
    'ThirdParty/**',
    '**/third_party/**',
    '**/bespoke/**',
    'build/**',
    'build_*/**',
    '.lintbin/**',
    '.git/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.cmake_linter',
    '--config=.cmakelintrc',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--dry-run={{DRYRUN}}',
    'cmakelint==1.4.1',
]

