name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake (${{ matrix.os }}, scalar fallback)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cmake-mkl:
    name: CMake (Linux, Intel MKL backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang gpg wget

      - name: Install Intel oneMKL
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        run: |
          cmake -S . -B build-mkl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLINALG_ENABLE_MKL=ON \
            -DCMAKE_PREFIX_PATH=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Build
        run: cmake --build build-mkl -j

      - name: Test
        run: ctest --test-dir build-mkl --output-on-failure

  cmake-blas:
    name: CMake (${{ matrix.os }}, OpenBLAS/LAPACKE backend)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang + OpenBLAS/LAPACKE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libopenblas-dev liblapacke-dev

      - name: Install Ninja + OpenBLAS (macOS)
        if: runner.os == 'macOS'
        # Homebrew's OpenBLAS is keg-only (not symlinked into the default
        # prefix, to avoid shadowing Apple's Accelerate), so its cblas.h/
        # lapacke.h need CMAKE_PREFIX_PATH pointed at the keg explicitly —
        # see CMakeLists.txt's find_path(LINALG_CBLAS_INCLUDE_DIR ...).
        # Without this, LINALG_ENABLE_BLAS would silently fall back to
        # Accelerate (GEMM/transpose only, no LAPACKE) instead.
        run: |
          brew install ninja openblas
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build-blas -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINALG_ENABLE_BLAS=ON

      - name: Build
        run: cmake --build build-blas -j

      - name: Test
        run: ctest --test-dir build-blas --output-on-failure

  cmake-lu-pivoting:
    name: CMake (${{ matrix.os }}, LU pivoting)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build-lupivot -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINALG_LU_PIVOTING=ON

      - name: Build
        run: cmake --build build-lupivot -j

      - name: Test
        run: ctest --test-dir build-lupivot --output-on-failure

  sanitizer:
    name: Sanitizer (${{ matrix.os }}, ASan+UBSan)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DLINALG_ENABLE_SANITIZER=ON
          -DLINALG_SANITIZER_TYPE=address,undefined

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  cuda-compile:
    name: CUDA (compile-only, no GPU runner)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y ninja-build cmake git

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # CMAKE_CUDA_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time — unavailable in this GPU-less
        # container, so a fixed architecture list is required here. This
        # job only compiles the GPU tree (no `ctest`): it catches build
        # breaks in include/matrix_operation_gpu/, not GPU correctness —
        # see docs/backend_roadmap.md §7 on that remaining manual,
        # on-hardware check.
        run: >
          cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLINALG_ENABLE_CUBLAS=ON
          -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build-cuda -j

  bazel:
    name: Bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Test
        # Target only this repo's own tests, rather than a recursive //...
        # (which loads every package it can reach, including this repo's
        # own dependencies): a subtractive "//... -//ThirdParty/..." still
        # fails, since Bazel loads packages under an excluded pattern before
        # applying the exclusion — and vendored trees under ThirdParty/ (e.g.
        # Logging's own Google Benchmark submodule) pull in tooling this
        # workspace never registers and was never meant to build here.
        # ThirdParty/... is built only as a library dependency (via
        # //:LinearAlgebra), not run as a test suite — CMake's equivalent
        # add_subdirectory(ThirdParty/Logging) likewise builds it with its
        # own testing disabled.
        run: bazel test //Testing/...

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLINALG_ENABLE_TESTING=ON
          -DLINALG_ENABLE_COVERAGE=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -S . -B build
          -DLINALG_ENABLE_TESTING=ON
          -DLINALG_ENABLE_COVERAGE=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
