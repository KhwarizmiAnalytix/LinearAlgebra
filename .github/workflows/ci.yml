name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake (${{ matrix.os }}, scalar fallback)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cmake-mkl:
    name: CMake (Linux, Intel MKL backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang gpg wget

      - name: Install Intel oneMKL
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        run: |
          cmake -S . -B build-mkl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLINALG_ENABLE_MKL=ON \
            -DCMAKE_PREFIX_PATH=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Build
        run: cmake --build build-mkl -j

      - name: Test
        run: ctest --test-dir build-mkl --output-on-failure

  bazel:
    name: Bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Test
        # Target only this repo's own tests, rather than a recursive //...
        # (which loads every package it can reach, including this repo's
        # own dependencies): a subtractive "//... -//ThirdParty/..." still
        # fails, since Bazel loads packages under an excluded pattern before
        # applying the exclusion — and vendored trees under ThirdParty/ (e.g.
        # Logging's own Google Benchmark submodule) pull in tooling this
        # workspace never registers and was never meant to build here.
        # ThirdParty/... is built only as a library dependency (via
        # //:LinearAlgebra), not run as a test suite — CMake's equivalent
        # add_subdirectory(ThirdParty/Logging) likewise builds it with its
        # own testing disabled.
        run: bazel test //Testing/...
