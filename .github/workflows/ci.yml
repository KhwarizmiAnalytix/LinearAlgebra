name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake (${{ matrix.os }}, ${{ matrix.compiler }}, native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja --build-type=Release

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Configuration regression checks
        run: python3 Testing/CMake/check_configurations.py

  eigen-reference:
    name: Eigen reference tests and benchmark smoke checks
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopenblas-dev liblapacke-dev
      - name: Configure
        run: >-
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-eigen --generator Ninja --build-type=Release
          --benchmark=ON
          --blas=ON --lto-mode=off
      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-eigen --parallel 2
      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-eigen --test-label Unit
      - name: Benchmark smoke checks
        run: |
          for operation in multiplication ludecomposition qrdecomposition choleskydecomposition svddecomposition eigen; do
            ./build-eigen/bin/benchmark_linalg_${operation} --benchmark_filter='/(8|16|32/32/32)/'
          done

  cmake-cxx20-baseline:
    name: C++20 baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-baseline --generator Ninja --preload-file .github/cmake/minimum-options.cmake
      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-baseline --parallel 4
      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-baseline

  cmake-mkl:
    name: CMake (Linux, MKL, BLAS=${{ matrix.blas }}, shared=${{ matrix.shared }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
        shared: ['OFF', 'ON']
    env:
      MKL_BLAS: ${{ matrix.blas }}
      MKL_SHARED: ${{ matrix.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang gpg wget libopenblas-dev liblapacke-dev

      - name: Install Intel oneMKL
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-mkl --generator Ninja --build-type=Release \
            --mkl=ON \
            --blas="$MKL_BLAS" --blas-vendor=OpenBLAS \
            --shared="$MKL_SHARED" \
            --prefix-path=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-mkl --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-mkl

  cmake-mkl-windows:
    name: CMake (Windows, MKL, BLAS=${{ matrix.blas }}, shared=${{ matrix.shared }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
        shared: ['OFF', 'ON']
    env:
      CC: cl
      CXX: cl
      MKL_BLAS: ${{ matrix.blas }}
      MKL_SHARED: ${{ matrix.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools, MKL, and OpenBLAS
        shell: pwsh
        run: |
          python -m pip install cmake==4.1.2 ninja mkl-devel
          if ($LASTEXITCODE -ne 0) { throw 'MKL installation failed' }
          $pythonPrefix = python -c 'import sys; print(sys.prefix)'
          $config = Get-ChildItem $pythonPrefix -Recurse -Filter MKLConfig.cmake | Select-Object -First 1
          if (-not $config) { throw 'MKL package did not install MKLConfig.cmake' }
          "MKL_DIR=$($config.DirectoryName)" >> $env:GITHUB_ENV
          Get-ChildItem $pythonPrefix -Recurse -Filter mkl_core*.dll |
            ForEach-Object { $_.DirectoryName } | Select-Object -Unique | Out-File -Append $env:GITHUB_PATH
          # vcpkg's openblas:x64-windows is MSVC-built with no Fortran toolchain,
          # so it ships BLAS only (no cheev_/LAPACK symbols), which fails
          # find_package(LAPACK REQUIRED) once BLA_VENDOR=OpenBLAS is pinned.
          # conda-forge's Windows OpenBLAS build bundles full LAPACK, so use the
          # Miniconda preinstalled on this runner image ($env:CONDA) instead.
          # Pin headers/import libraries and the runtime together: conda-forge's
          # win-64 0.3.34 build crashes in double-precision kernels on AMD Zen 4/5
          # runners with AVX-512 exposed (even with one thread or a forced core).
          # https://github.com/conda-forge/openblas-feedstock/issues/196
          & "$env:CONDA/Scripts/conda.exe" install -y -c conda-forge "openblas=0.3.33" "libopenblas=0.3.33"
          if ($LASTEXITCODE -ne 0) { throw 'OpenBLAS installation failed' }
          $prefix = "$env:CONDA/Library"
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH
      - name: Configure, build, and test both vendor interfaces
        shell: pwsh
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-mkl --generator Ninja --build-type=Release `
            --mkl=ON "--mkl-dir=$env:MKL_DIR" `
            "--blas=$env:MKL_BLAS" --blas-vendor=OpenBLAS `
            "--shared=$env:MKL_SHARED"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-mkl --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-mkl
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

  cmake-blas:
    name: CMake (${{ matrix.os }}, OpenBLAS/LAPACKE backend)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang + OpenBLAS/LAPACKE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libopenblas-dev liblapacke-dev

      - name: Install Ninja + OpenBLAS (macOS)
        if: runner.os == 'macOS'
        # Homebrew's OpenBLAS is keg-only (not symlinked into the default
        # prefix, to avoid shadowing Apple's Accelerate), so its cblas.h/
        # lapacke.h need CMAKE_PREFIX_PATH pointed at the keg explicitly —
        # see CMakeLists.txt's find_path(LINALG_CBLAS_INCLUDE_DIR ...).
        # Without this, LINALG_ENABLE_BLAS would silently fall back to
        # Accelerate (GEMM/transpose only, no LAPACKE) instead.
        run: |
          brew install ninja openblas
          echo "CMAKE_PREFIX_PATH=$(brew --install-prefix openblas)" >> "$GITHUB_ENV"

      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-blas --generator Ninja --build-type=Release --blas=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-blas --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-blas

      - name: Explicit Accelerate with OpenBLAS installed (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-accelerate --generator Ninja --build-type=Release \
            --blas=ON --blas-vendor=Apple
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-accelerate --parallel 4
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-accelerate

  cmake-valgrind:
    name: CTest Valgrind dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-memcheck --generator Ninja --valgrind=ON
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-memcheck --parallel 4
      - run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-memcheck --memcheck

  cmake-lu-pivoting:
    name: CMake (${{ matrix.os }}, LU pivoting)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-lupivot --generator Ninja --build-type=Release --lu-pivoting=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-lupivot --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-lupivot

  sanitizer:
    name: Sanitizer (${{ matrix.os }}, ASan+UBSan)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-san --generator Ninja --build-type=Debug
          --sanitizer=ON
          --sanitizer-types=address,undefined

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-san --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-san

  cuda-compile:
    name: CUDA (Linux, BLAS=${{ matrix.blas }}, MKL=${{ matrix.mkl }}, examples=${{ matrix.examples }})
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - blas: 'OFF'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'OFF'
            mkl: 'ON'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'ON'
            examples: 'ON'
    env:
      CUDA_BLAS: ${{ matrix.blas }}
      CUDA_MKL: ${{ matrix.mkl }}
      CUDA_EXAMPLES: ${{ matrix.examples }}
    steps:
      - name: Install build tools
        # Ubuntu 22.04 ships CMake 3.22; the dependency helper's
        # find_package(... GLOBAL) requires CMake 3.24 or newer.
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip gpg wget libopenblas-dev liblapacke-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Intel oneMKL for combined backend cases
        if: matrix.mkl == 'ON'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        # CMAKE_CUDA_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time — unavailable in this GPU-less
        # container, so a fixed architecture list is required here. This
        # job only compiles the GPU tree (no `ctest`): it catches build
        # breaks in include/matrix_operation_gpu/, not GPU correctness —
        # see docs/backend_roadmap.md §7 on that remaining manual,
        # on-hardware check.
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-cuda --generator Ninja --build-type=Release
          --cublas=ON
          --lto-mode=off --cxx-standard=20
          --blas="$CUDA_BLAS" --blas-vendor=OpenBLAS
          --mkl="$CUDA_MKL"
          --examples="$CUDA_EXAMPLES"
          --prefix-path=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl
          --cuda-architectures=75

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-cuda --parallel 4

  cuda-windows:
    name: CUDA (Windows compile-only)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install cmake==4.1.2 ninja
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "thrust", "cublas", "cublas_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "nvjitlink"]'
      - name: Configure and compile GPU targets without executing GPU workloads
        shell: pwsh
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-cuda --generator Ninja --build-type=Release `
            --cublas=ON --cuda-architectures=75 `
            --lto-mode=off --cxx-standard=20
          if ($LASTEXITCODE -ne 0) { throw 'CUDA configure failed' }
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-cuda --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CUDA build failed' }

  hip-compile:
    name: HIP (Linux, BLAS=${{ matrix.blas }}, MKL=${{ matrix.mkl }}, examples=${{ matrix.examples }})
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.3.1
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - blas: 'OFF'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'OFF'
            mkl: 'ON'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'ON'
            examples: 'ON'
    env:
      HIP_BLAS: ${{ matrix.blas }}
      HIP_MKL: ${{ matrix.mkl }}
      HIP_EXAMPLES: ${{ matrix.examples }}
    steps:
      - name: Install build tools and hipBLAS/hipSOLVER
        # Ubuntu 22.04 ships CMake 3.22; the dependency helper's
        # find_package(... GLOBAL) requires CMake 3.24 or newer. hipBLAS/
        # hipSOLVER devel packages are not part of the base ROCm dev image.
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip gpg wget libopenblas-dev liblapacke-dev hipblas-dev hipsolver-dev rocthrust-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Intel oneMKL for combined backend cases
        if: matrix.mkl == 'ON'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        # CMAKE_HIP_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time — unavailable in this GPU-less
        # container, so a fixed architecture list is required here, the same
        # way cuda-compile pins CMAKE_CUDA_ARCHITECTURES. This job only
        # compiles the GPU tree (no `ctest`): it catches build breaks in
        # src/matrix_operation/gpu/hipblas/, not GPU correctness — see
        # docs/backend_roadmap.md §7 on that remaining manual, on-hardware
        # check.
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-hip --generator Ninja --build-type=Release
          --rocblas=ON
          --lto-mode=off --cxx-standard=20
          --blas="$HIP_BLAS" --blas-vendor=OpenBLAS
          --mkl="$HIP_MKL"
          --examples="$HIP_EXAMPLES"
          --prefix-path="/opt/intel/oneapi/mkl/latest/lib/cmake/mkl;/opt/rocm"
          --hip-architectures=gfx1100

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-hip --parallel 4

  metal-compile:
    name: Metal (macOS compile-only)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      OBJCXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja
      - name: Configure
        # Compile the Metal bridge and GPU tests without requiring a GPU on
        # the hosted runner. Runtime validation needs a Metal-capable host.
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-metal --generator Ninja --build-type=Release
          --metal=ON
          --lto-mode=off --cxx-standard=20
          --build-testing=ON --testing=ON --gtest=ON
      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-metal --parallel 4

  simd:
    name: SIMD (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: no
          - os: ubuntu-latest
            backend: sse
          - os: ubuntu-latest
            backend: avx
          - os: ubuntu-latest
            backend: avx2
          - os: ubuntu-latest
            backend: avx512
          - os: macos-latest
            backend: neon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          SIMD_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-simd --generator Ninja --build-type=Release \
            --cpu-backend="$SIMD_BACKEND"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-simd --parallel 4

      - name: Test when the runner supports the ISA
        env:
          SIMD_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          case "$SIMD_BACKEND" in
            avx) required_flags="avx" ;;
            avx2) required_flags="avx2 fma" ;;
            avx512) required_flags="avx512f avx2 fma" ;;
            neon)
              test "$(uname -m)" = arm64
              required_flags="" ;;
            *) required_flags="" ;;
          esac
          for flag in $required_flags; do
            if ! grep -qw "$flag" /proc/cpuinfo; then
              echo "Compile-only: runner lacks $flag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-simd

  cuda-runtime:
    name: CUDA (GPU runtime)
    # Enable only after registering a GPU runner with these labels, Docker,
    # an NVIDIA driver, and the NVIDIA Container Toolkit installed.
    # Run trusted main-branch code only on the persistent self-hosted runner.
    if: github.event_name == 'push' && vars.LINALG_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu22.04
      options: --gpus all
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify GPU access
        run: nvidia-smi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-gpu --generator Ninja --build-type=Release
          --cublas=ON --cuda-architectures=native

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-gpu --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-gpu

  hip-runtime:
    name: HIP (GPU runtime)
    # Enable only after registering an AMD GPU runner with these labels,
    # Docker, the amdgpu kernel driver, and /dev/kfd + /dev/dri exposed to
    # the container. Run trusted main-branch code only on the persistent
    # self-hosted runner.
    if: github.event_name == 'push' && vars.LINALG_ROCM_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30
    container:
      image: rocm/dev-ubuntu-22.04:6.3.1
      options: --device=/dev/kfd --device=/dev/dri --group-add video --group-add render --security-opt seccomp=unconfined
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip hipblas-dev hipsolver-dev
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify GPU access
        run: rocm-smi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-gpu --generator Ninja --build-type=Release
          --rocblas=ON --hip-architectures=native
          --prefix-path=/opt/rocm

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-gpu --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-gpu

  install-consumer:
    name: Installed package (${{ matrix.os }}, shared=${{ matrix.shared }}, ${{ matrix.instrumentation }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: ['ON', 'OFF']
        instrumentation: ['none']
        include:
          - os: ubuntu-latest
            shared: 'OFF'
            instrumentation: address
          - os: macos-latest
            shared: 'OFF'
            instrumentation: address
          - os: ubuntu-latest
            shared: 'OFF'
            instrumentation: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build and install packages, then run external consumer
        env:
          BUILD_SHARED: ${{ matrix.shared }}
          INSTRUMENTATION: ${{ matrix.instrumentation }}
        shell: bash
        run: |
          package_prefix="$RUNNER_TEMP/linalg-package"
          if [[ "$RUNNER_OS" == macOS ]]; then
            runtime_origin='@loader_path'
          else
            # shellcheck disable=SC2016 # Keep the loader's literal origin token.
            runtime_origin='$ORIGIN'
          fi
          instrumentation_flags=()
          if [[ "$INSTRUMENTATION" == address ]]; then
            instrumentation_flags=(--sanitizer=ON)
          elif [[ "$INSTRUMENTATION" == coverage ]]; then
            instrumentation_flags=(--coverage=ON)
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir ThirdParty/Logging --build-dir build-logging-install --generator Ninja \
            --build-type=Release --shared="$BUILD_SHARED" \
            --logging-testing=OFF --logging-benchmark=OFF \
            --logging-examples=OFF --install-prefix="$package_prefix" \
            --install-rpath="$runtime_origin"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-logging-install --parallel 4
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build-logging-install
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build-install --generator Ninja --build-type=Release \
            --shared="$BUILD_SHARED" --testing=OFF \
            --system-logging=ON --prefix-path="$package_prefix" \
            --install-libdir=customlib --install-includedir=custominclude \
            --install-prefix="$package_prefix" --install-rpath="$runtime_origin/../lib" \
            "${instrumentation_flags[@]}"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-install --parallel 4
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build-install
          mv "$package_prefix" "$RUNNER_TEMP/linalg-package-moved"
          package_prefix="$RUNNER_TEMP/linalg-package-moved"
          # Copy the consumer outside the checkout; it must use installed headers/libraries.
          cp --test-filter Testing/InstallConsumer "$RUNNER_TEMP/linalg-consumer"
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir "$RUNNER_TEMP/linalg-consumer" --build-dir "$RUNNER_TEMP/linalg-consumer-build" \
            --generator Ninja --build-type=Release --prefix-path="$package_prefix" \
            --package-dir="$package_prefix/customlib/cmake/LinearAlgebra"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir "$RUNNER_TEMP/linalg-consumer-build" --parallel 4
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir "$RUNNER_TEMP/linalg-consumer-build"

  bazel:
    name: Bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Test
        # Target only this repo's own tests, rather than a recursive //...
        # (which loads every package it can reach, including this repo's
        # own dependencies): a subtractive "//... -//ThirdParty/..." still
        # fails, since Bazel loads packages under an excluded pattern before
        # applying the exclusion — and vendored trees under ThirdParty/ (e.g.
        # Logging's own Google Benchmark submodule) pull in tooling this
        # workspace never registers and was never meant to build here.
        # ThirdParty/... is built only as a library dependency (via
        # //:LinearAlgebra), not run as a test suite — CMake's equivalent
        # add_subdirectory(ThirdParty/Logging) likewise builds it with its
        # own testing disabled.
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//Testing/...

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: native
          - os: ubuntu-latest
            backend: openblas
          - os: ubuntu-latest
            backend: mkl
          - os: macos-latest
            backend: native
          - os: windows-latest
            backend: native
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install OpenBLAS/LAPACKE
        if: matrix.backend == 'openblas'
        run: sudo apt-get install -y libopenblas-dev liblapacke-dev

      - name: Install Intel oneMKL
        if: matrix.backend == 'mkl'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --install-prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --compile-commands=ON
          --testing=ON
          --coverage=ON
          --blas=${{ matrix.backend == 'openblas' && 'ON' || 'OFF' }}
          --mkl=${{ matrix.backend == 'mkl' && 'ON' || 'OFF' }}
          --prefix-path=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --testing=ON
          --coverage=ON

      - name: Verify coverage backend
        if: matrix.os != 'windows-latest'
        env:
          COVERAGE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          commands = json.loads(Path("build/compile_commands.json").read_text())
          command = next(entry["command"] for entry in commands if entry["file"].endswith("/src/matrix_operation/cpu/trace.cpp"))
          backend = os.environ["COVERAGE_BACKEND"]
          expected = {
              "LINALG_HAS_MKL": int(backend == "mkl"),
              "LINALG_HAS_BLAS": int(backend == "openblas"),
              "LINALG_HAS_LAPACKE": int(backend == "openblas"),
          }
          for macro, value in expected.items():
              assert f"-D{macro}={value}" in command, f"Expected {macro}={value} for {backend}"
          PYCODE

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.backend }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          flags: ${{ matrix.backend }}
          name: coverage-${{ matrix.os }}-${{ matrix.backend }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Compiler cache: exercises LINALG_ENABLE_CACHE / LINALG_CACHE_BACKEND
  # (ccache, sccache, buildcache) across Linux, macOS, and Windows.
  # ---------------------------------------------------------------------------
  cache:
    name: Cache / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
          - name: macos-ccache
            os: macos-latest
            backend: ccache
          - name: macos-sccache
            os: macos-latest
            backend: sccache
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
          - name: windows-ccache
            os: windows-latest
            backend: ccache
          - name: windows-sccache
            os: windows-latest
            backend: sccache
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install ccache (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'ccache'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS' && matrix.backend == 'ccache'
        run: brew install ccache

      - name: Install ccache (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'ccache'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.backend == 'sccache'
        with:
          version: v0.12.0

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --install-prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ -n "${{ matrix.backend }}" ]]; then
            extra+=("--cache=ON" "--cache-backend=${{ matrix.backend }}")
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja \
            --build-type=Release \
            --cpu-backend=no \
            --gpu-backend=none \
            --testing=ON \
            "${extra[@]}"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release --test-timeout 300
