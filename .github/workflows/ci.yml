name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake (${{ matrix.os }}, ${{ matrix.compiler }}, native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configuration regression checks
        run: python3 Testing/CMake/check_configurations.py

  cmake-minimum-linux:
    name: CMake 3.24.4 (${{ matrix.compiler }} ${{ matrix.version }}, C++17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            id: GNU
            version: '9.1'
          - compiler: clang
            id: Clang
            version: '9.0'
    env:
      MINIMUM_COMPILER: ${{ matrix.compiler }}
      MINIMUM_COMPILER_ID: ${{ matrix.id }}
      MINIMUM_COMPILER_VERSION: ${{ matrix.version }}
    steps:
      # Checkout on the host: JavaScript actions need a newer libc than this image.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download pinned build tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/minimum-tools/cmake"
          curl -fsSL --retry 3 \
            https://github.com/Kitware/CMake/releases/download/v3.24.4/cmake-3.24.4-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" --strip-components=1 \
            -C "$RUNNER_TEMP/minimum-tools/cmake"
          if [[ "$MINIMUM_COMPILER" == clang ]]; then
            mkdir -p "$RUNNER_TEMP/minimum-tools/clang"
            curl -fsSL --retry 3 \
              https://releases.llvm.org/9.0.0/clang+llvm-9.0.0-x86_64-linux-gnu-ubuntu-16.04.tar.xz \
              -o "$RUNNER_TEMP/clang.tar.xz"
            tar -xJf "$RUNNER_TEMP/clang.tar.xz" --strip-components=1 \
              -C "$RUNNER_TEMP/minimum-tools/clang"

            # This clang binary was built for Ubuntu 16.04 and needs the ncurses5
            # ABI (libtinfo.so.5). The gcc:9.1.0 build container is Debian
            # buster, which dropped libtinfo5 entirely in favor of libtinfo6.
            # Debian Stretch is the last release to carry it; archive.debian.org
            # is Debian's own permanent archive for EOL releases.
            curl -fsSL --retry 3 \
              https://archive.debian.org/debian/pool/main/n/ncurses/libtinfo5_6.0+20161126-1+deb9u2_amd64.deb \
              -o "$RUNNER_TEMP/libtinfo5.deb"
            dpkg-deb -x "$RUNNER_TEMP/libtinfo5.deb" "$RUNNER_TEMP/libtinfo5"
            cp "$RUNNER_TEMP"/libtinfo5/lib/x86_64-linux-gnu/libtinfo.so.5* \
              "$RUNNER_TEMP/minimum-tools/clang/lib/"
          fi

      - name: Configure, build, and test the minimum compiler
        shell: bash
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$RUNNER_TEMP/minimum-tools:/ci-tools:ro" -w /src \
            -e MINIMUM_COMPILER -e MINIMUM_COMPILER_ID -e MINIMUM_COMPILER_VERSION \
            gcc:9.1.0 bash -euo pipefail <<'BASH'
              export PATH="/ci-tools/cmake/bin:$PATH"
              if [[ "$MINIMUM_COMPILER" == clang ]]; then
                export CC=/ci-tools/clang/bin/clang CXX=/ci-tools/clang/bin/clang++
                export CFLAGS=--gcc-toolchain=/usr/local CXXFLAGS=--gcc-toolchain=/usr/local
                export LD_LIBRARY_PATH=/ci-tools/clang/lib
              else
                export CC=gcc CXX=g++
              fi
              cmake -S . -B build-minimum -G "Unix Makefiles" \
                -C .github/cmake/minimum-options.cmake \
                -DCMAKE_PROJECT_LinearAlgebra_INCLUDE="$PWD/.github/cmake/check-compiler.cmake" \
                -DLINALG_CI_COMPILER_ID="$MINIMUM_COMPILER_ID" \
                -DLINALG_CI_COMPILER_VERSION="$MINIMUM_COMPILER_VERSION"
              cmake --build build-minimum --parallel 4
              ctest --test-dir build-minimum --output-on-failure --no-tests=error
          BASH

  cmake-minimum-appleclang:
    name: CMake minimum (AppleClang 11.0, C++17)
    if: github.event_name == 'push' && vars.LINALG_APPLECLANG_11_CI_ENABLED == 'true'
    runs-on: [self-hosted, macOS, X64, appleclang-11]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-minimum -G Ninja \
            -C .github/cmake/minimum-options.cmake \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_PROJECT_LinearAlgebra_INCLUDE="$PWD/.github/cmake/check-compiler.cmake" \
            -DLINALG_CI_COMPILER_ID=AppleClang -DLINALG_CI_COMPILER_VERSION=11.0

      - name: Build
        run: cmake --build build-minimum --parallel 4

      - name: Test
        run: ctest --test-dir build-minimum --output-on-failure --no-tests=error

  cmake-minimum-msvc:
    name: CMake minimum (MSVC 19.14, C++17)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSVC 19.14 and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools_2017.exe'
          $installPath = Join-Path $env:RUNNER_TEMP 'vs2017'
          curl.exe --fail --location --retry 3 https://aka.ms/vs/15/release/vs_buildtools.exe --output $installer
          if ($LASTEXITCODE -ne 0) { throw 'VS 2017 installer download failed' }

          # The v141 component in VS 2022 installs 14.16, not the 14.14 baseline.
          # VS 2017 still offers the exact 15.7 toolset as an optional component.
          $arguments = @(
            '--quiet', '--wait', '--norestart', '--nocache',
            '--installPath', "`"$installPath`"",
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.14.14',
            '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "VS 2017 installation failed with exit code $($process.ExitCode)"
          }

          $vcvars = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) { throw "Missing toolchain setup: $vcvars" }
          $compiler = Get-ChildItem "$installPath\VC\Tools\MSVC\14.14.*\bin\Hostx64\x64\cl.exe"
          if (-not $compiler) { throw 'MSVC 14.14 x64 compiler was not installed' }
          "LINALG_MSVC_1914_VCVARSALL=$vcvars" >> $env:GITHUB_ENV

      - name: Configure, build, and test
        shell: cmd
        run: |
          if not defined LINALG_MSVC_1914_VCVARSALL exit /b 1
          call "%LINALG_MSVC_1914_VCVARSALL%" x64 10.0.19041.0 -vcvars_ver=14.14
          if errorlevel 1 exit /b 1
          cmake -S . -B build-minimum -G Ninja ^
            -C .github/cmake/minimum-options.cmake ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_PROJECT_LinearAlgebra_INCLUDE="%CD%/.github/cmake/check-compiler.cmake" ^
            -DLINALG_CI_COMPILER_ID=MSVC -DLINALG_CI_COMPILER_VERSION=19.14
          if errorlevel 1 exit /b 1
          cmake --build build-minimum --parallel 4
          if errorlevel 1 exit /b 1
          ctest --test-dir build-minimum --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1

  cmake-mkl:
    name: CMake (Linux, MKL, BLAS=${{ matrix.blas }}, shared=${{ matrix.shared }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
        shared: ['OFF', 'ON']
    env:
      MKL_BLAS: ${{ matrix.blas }}
      MKL_SHARED: ${{ matrix.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang gpg wget libopenblas-dev liblapacke-dev

      - name: Install Intel oneMKL
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        run: |
          cmake -S . -B build-mkl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLINALG_ENABLE_MKL=ON \
            -DLINALG_ENABLE_BLAS="$MKL_BLAS" -DBLA_VENDOR=OpenBLAS \
            -DBUILD_SHARED_LIBS="$MKL_SHARED" \
            -DCMAKE_PREFIX_PATH=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Build
        run: cmake --build build-mkl -j

      - name: Test
        run: ctest --test-dir build-mkl --output-on-failure --no-tests=error

  cmake-mkl-windows:
    name: CMake (Windows, MKL, BLAS=${{ matrix.blas }}, shared=${{ matrix.shared }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        blas: ['OFF', 'ON']
        shared: ['OFF', 'ON']
    env:
      CC: cl
      CXX: cl
      MKL_BLAS: ${{ matrix.blas }}
      MKL_SHARED: ${{ matrix.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools, MKL, and OpenBLAS
        shell: pwsh
        run: |
          python -m pip install cmake==4.1.2 ninja mkl-devel
          if ($LASTEXITCODE -ne 0) { throw 'MKL installation failed' }
          $pythonPrefix = python -c 'import sys; print(sys.prefix)'
          $config = Get-ChildItem $pythonPrefix -Recurse -Filter MKLConfig.cmake | Select-Object -First 1
          if (-not $config) { throw 'MKL package did not install MKLConfig.cmake' }
          "MKL_DIR=$($config.DirectoryName)" >> $env:GITHUB_ENV
          Get-ChildItem $pythonPrefix -Recurse -Filter mkl_core*.dll |
            ForEach-Object { $_.DirectoryName } | Select-Object -Unique | Out-File -Append $env:GITHUB_PATH
          # vcpkg's openblas:x64-windows is MSVC-built with no Fortran toolchain,
          # so it ships BLAS only (no cheev_/LAPACK symbols), which fails
          # find_package(LAPACK REQUIRED) once BLA_VENDOR=OpenBLAS is pinned.
          # conda-forge's Windows OpenBLAS build bundles full LAPACK, so use the
          # Miniconda preinstalled on this runner image ($env:CONDA) instead.
          # Pin headers/import libraries and the runtime together: conda-forge's
          # win-64 0.3.34 build crashes in double-precision kernels on AMD Zen 4/5
          # runners with AVX-512 exposed (even with one thread or a forced core).
          # https://github.com/conda-forge/openblas-feedstock/issues/196
          & "$env:CONDA/Scripts/conda.exe" install -y -c conda-forge "openblas=0.3.33" "libopenblas=0.3.33"
          if ($LASTEXITCODE -ne 0) { throw 'OpenBLAS installation failed' }
          $prefix = "$env:CONDA/Library"
          "CMAKE_PREFIX_PATH=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH
      - name: Configure, build, and test both vendor interfaces
        shell: pwsh
        run: |
          cmake -S . -B build-mkl -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DLINALG_ENABLE_MKL=ON "-DMKL_DIR=$env:MKL_DIR" `
            "-DLINALG_ENABLE_BLAS=$env:MKL_BLAS" -DBLA_VENDOR=OpenBLAS `
            "-DBUILD_SHARED_LIBS=$env:MKL_SHARED"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build-mkl --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build-mkl --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

  cmake-blas:
    name: CMake (${{ matrix.os }}, OpenBLAS/LAPACKE backend)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang + OpenBLAS/LAPACKE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libopenblas-dev liblapacke-dev

      - name: Install Ninja + OpenBLAS (macOS)
        if: runner.os == 'macOS'
        # Homebrew's OpenBLAS is keg-only (not symlinked into the default
        # prefix, to avoid shadowing Apple's Accelerate), so its cblas.h/
        # lapacke.h need CMAKE_PREFIX_PATH pointed at the keg explicitly —
        # see CMakeLists.txt's find_path(LINALG_CBLAS_INCLUDE_DIR ...).
        # Without this, LINALG_ENABLE_BLAS would silently fall back to
        # Accelerate (GEMM/transpose only, no LAPACKE) instead.
        run: |
          brew install ninja openblas
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build-blas -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINALG_ENABLE_BLAS=ON

      - name: Build
        run: cmake --build build-blas -j

      - name: Test
        run: ctest --test-dir build-blas --output-on-failure

      - name: Explicit Accelerate with OpenBLAS installed (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-accelerate -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLINALG_ENABLE_BLAS=ON -DBLA_VENDOR=Apple
          cmake --build build-accelerate --parallel 4
          ctest --test-dir build-accelerate --output-on-failure --no-tests=error

  cmake-valgrind:
    name: CTest Valgrind dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind
      - run: cmake -S . -B build-memcheck -G Ninja -DLINALG_ENABLE_VALGRIND=ON
      - run: cmake --build build-memcheck --parallel 4
      - run: ctest --test-dir build-memcheck -T memcheck --output-on-failure --no-tests=error

  cmake-lu-pivoting:
    name: CMake (${{ matrix.os }}, LU pivoting)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build-lupivot -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINALG_LU_PIVOTING=ON

      - name: Build
        run: cmake --build build-lupivot -j

      - name: Test
        run: ctest --test-dir build-lupivot --output-on-failure

  sanitizer:
    name: Sanitizer (${{ matrix.os }}, ASan+UBSan)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DLINALG_ENABLE_SANITIZER=ON
          -DLINALG_SANITIZER_TYPE=address,undefined

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  cuda-compile:
    name: CUDA (Linux, BLAS=${{ matrix.blas }}, MKL=${{ matrix.mkl }}, examples=${{ matrix.examples }})
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - blas: 'OFF'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'OFF'
            mkl: 'ON'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'ON'
            examples: 'ON'
    env:
      CUDA_BLAS: ${{ matrix.blas }}
      CUDA_MKL: ${{ matrix.mkl }}
      CUDA_EXAMPLES: ${{ matrix.examples }}
    steps:
      - name: Install build tools
        # Ubuntu 22.04 ships CMake 3.22; the dependency helper's
        # find_package(... GLOBAL) requires CMake 3.24 or newer.
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip gpg wget libopenblas-dev liblapacke-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Intel oneMKL for combined backend cases
        if: matrix.mkl == 'ON'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        # CMAKE_CUDA_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time — unavailable in this GPU-less
        # container, so a fixed architecture list is required here. This
        # job only compiles the GPU tree (no `ctest`): it catches build
        # breaks in include/matrix_operation_gpu/, not GPU correctness —
        # see docs/backend_roadmap.md §7 on that remaining manual,
        # on-hardware check.
        run: >
          cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLINALG_ENABLE_CUBLAS=ON
          -DLINALG_LTO_MODE=off -DLINALG_CXX_STANDARD=17
          -DLINALG_ENABLE_BLAS="$CUDA_BLAS" -DBLA_VENDOR=OpenBLAS
          -DLINALG_ENABLE_MKL="$CUDA_MKL"
          -DLINALG_BUILD_EXAMPLES="$CUDA_EXAMPLES"
          -DCMAKE_PREFIX_PATH=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl
          -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build-cuda --parallel 4

  cuda-windows:
    name: CUDA (Windows compile-only)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install cmake==4.1.2 ninja
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          sub-packages: '["nvcc", "cudart", "crt", "nvvm", "thrust", "cublas", "cublas_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev", "nvjitlink"]'
      - name: Configure and compile GPU targets without executing GPU workloads
        shell: pwsh
        run: |
          cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DLINALG_ENABLE_CUBLAS=ON -DCMAKE_CUDA_ARCHITECTURES=75 `
            -DLINALG_LTO_MODE=off -DLINALG_CXX_STANDARD=17
          if ($LASTEXITCODE -ne 0) { throw 'CUDA configure failed' }
          cmake --build build-cuda --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CUDA build failed' }

  hip-compile:
    name: HIP (Linux, BLAS=${{ matrix.blas }}, MKL=${{ matrix.mkl }}, examples=${{ matrix.examples }})
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.3.1
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - blas: 'OFF'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'OFF'
            examples: 'OFF'
          - blas: 'OFF'
            mkl: 'ON'
            examples: 'OFF'
          - blas: 'ON'
            mkl: 'ON'
            examples: 'ON'
    env:
      HIP_BLAS: ${{ matrix.blas }}
      HIP_MKL: ${{ matrix.mkl }}
      HIP_EXAMPLES: ${{ matrix.examples }}
    steps:
      - name: Install build tools and hipBLAS/hipSOLVER
        # Ubuntu 22.04 ships CMake 3.22; the dependency helper's
        # find_package(... GLOBAL) requires CMake 3.24 or newer. hipBLAS/
        # hipSOLVER devel packages are not part of the base ROCm dev image.
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip gpg wget libopenblas-dev liblapacke-dev hipblas-dev hipsolver-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Intel oneMKL for combined backend cases
        if: matrix.mkl == 'ON'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor > /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneAPI.list
          apt-get update
          apt-get install -y intel-oneapi-mkl-devel

      - name: Configure
        # CMAKE_HIP_ARCHITECTURES defaults to "native", which queries an
        # actual GPU at configure time — unavailable in this GPU-less
        # container, so a fixed architecture list is required here, the same
        # way cuda-compile pins CMAKE_CUDA_ARCHITECTURES. This job only
        # compiles the GPU tree (no `ctest`): it catches build breaks in
        # src/matrix_operation/gpu/hipblas/, not GPU correctness — see
        # docs/backend_roadmap.md §7 on that remaining manual, on-hardware
        # check.
        run: >
          cmake -S . -B build-hip -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLINALG_ENABLE_ROCBLAS=ON
          -DLINALG_LTO_MODE=off -DLINALG_CXX_STANDARD=17
          -DLINALG_ENABLE_BLAS="$HIP_BLAS" -DBLA_VENDOR=OpenBLAS
          -DLINALG_ENABLE_MKL="$HIP_MKL"
          -DLINALG_BUILD_EXAMPLES="$HIP_EXAMPLES"
          -DCMAKE_PREFIX_PATH="/opt/intel/oneapi/mkl/latest/lib/cmake/mkl;/opt/rocm"
          -DCMAKE_HIP_ARCHITECTURES=gfx1100

      - name: Build
        run: cmake --build build-hip --parallel 4

  simd:
    name: SIMD (${{ matrix.isa }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: disabled
          - os: ubuntu-latest
            isa: scalar
          - os: ubuntu-latest
            isa: sse2
          - os: ubuntu-latest
            isa: avx
          - os: ubuntu-latest
            isa: avx2
          - os: ubuntu-latest
            isa: avx512
          - os: macos-latest
            isa: neon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          SIMD_ISA: ${{ matrix.isa }}
        shell: bash
        run: |
          if [[ "$SIMD_ISA" == disabled ]]; then
            cmake -S . -B build-simd -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINALG_ENABLE_VECTORIZATION=OFF
          else
            cmake -S . -B build-simd -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DLINALG_ENABLE_VECTORIZATION=ON -DLINALG_VECTORIZATION_ISA="$SIMD_ISA"
          fi

      - name: Build
        run: cmake --build build-simd --parallel 4

      - name: Test when the runner supports the ISA
        env:
          SIMD_ISA: ${{ matrix.isa }}
        shell: bash
        run: |
          case "$SIMD_ISA" in
            avx) required_flags="avx" ;;
            avx2) required_flags="avx2 fma" ;;
            avx512) required_flags="avx512f avx2 fma" ;;
            neon)
              test "$(uname -m)" = arm64
              required_flags="" ;;
            *) required_flags="" ;;
          esac
          for flag in $required_flags; do
            if ! grep -qw "$flag" /proc/cpuinfo; then
              echo "Compile-only: runner lacks $flag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          ctest --test-dir build-simd --output-on-failure --no-tests=error

  cuda-runtime:
    name: CUDA (GPU runtime)
    # Enable only after registering a GPU runner with these labels, Docker,
    # an NVIDIA driver, and the NVIDIA Container Toolkit installed.
    # Run trusted main-branch code only on the persistent self-hosted runner.
    if: github.event_name == 'push' && vars.LINALG_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu22.04
      options: --gpus all
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify GPU access
        run: nvidia-smi

      - name: Configure
        run: >
          cmake -S . -B build-gpu -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLINALG_ENABLE_CUBLAS=ON -DCMAKE_CUDA_ARCHITECTURES=native

      - name: Build
        run: cmake --build build-gpu --parallel 4

      - name: Test
        run: ctest --test-dir build-gpu --output-on-failure --no-tests=error

  hip-runtime:
    name: HIP (GPU runtime)
    # Enable only after registering an AMD GPU runner with these labels,
    # Docker, the amdgpu kernel driver, and /dev/kfd + /dev/dri exposed to
    # the container. Run trusted main-branch code only on the persistent
    # self-hosted runner.
    if: github.event_name == 'push' && vars.LINALG_ROCM_GPU_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, rocm]
    timeout-minutes: 30
    container:
      image: rocm/dev-ubuntu-22.04:6.3.1
      options: --device=/dev/kfd --device=/dev/dri --group-add video --group-add render --security-opt seccomp=unconfined
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip hipblas-dev hipsolver-dev
          python3 -m pip install "cmake>=3.24,<4"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify GPU access
        run: rocm-smi

      - name: Configure
        run: >
          cmake -S . -B build-gpu -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLINALG_ENABLE_ROCBLAS=ON -DCMAKE_HIP_ARCHITECTURES=native
          -DCMAKE_PREFIX_PATH=/opt/rocm

      - name: Build
        run: cmake --build build-gpu --parallel 4

      - name: Test
        run: ctest --test-dir build-gpu --output-on-failure --no-tests=error

  install-consumer:
    name: Installed package (${{ matrix.os }}, shared=${{ matrix.shared }}, ${{ matrix.instrumentation }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: ['ON', 'OFF']
        instrumentation: ['none']
        include:
          - os: ubuntu-latest
            shared: 'OFF'
            instrumentation: address
          - os: macos-latest
            shared: 'OFF'
            instrumentation: address
          - os: ubuntu-latest
            shared: 'OFF'
            instrumentation: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build and install packages, then run external consumer
        env:
          BUILD_SHARED: ${{ matrix.shared }}
          INSTRUMENTATION: ${{ matrix.instrumentation }}
        shell: bash
        run: |
          package_prefix="$RUNNER_TEMP/linalg-package"
          if [[ "$RUNNER_OS" == macOS ]]; then
            runtime_origin='@loader_path'
          else
            # shellcheck disable=SC2016 # Keep the loader's literal origin token.
            runtime_origin='$ORIGIN'
          fi
          instrumentation_flags=()
          if [[ "$INSTRUMENTATION" == address ]]; then
            instrumentation_flags=(-DLINALG_ENABLE_SANITIZER=ON)
          elif [[ "$INSTRUMENTATION" == coverage ]]; then
            instrumentation_flags=(-DLINALG_ENABLE_COVERAGE=ON)
          fi
          cmake -S ThirdParty/Logging -B build-logging-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS="$BUILD_SHARED" \
            -DLOGGING_ENABLE_TESTING=OFF -DLOGGING_ENABLE_BENCHMARK=OFF \
            -DLOGGING_ENABLE_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$package_prefix" \
            -DCMAKE_INSTALL_RPATH="$runtime_origin"
          cmake --build build-logging-install --parallel 4
          cmake --install build-logging-install
          cmake -S . -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS="$BUILD_SHARED" -DLINALG_ENABLE_TESTING=OFF \
            -DLINALG_USE_SYSTEM_LOGGING=ON -DCMAKE_PREFIX_PATH="$package_prefix" \
            -DCMAKE_INSTALL_LIBDIR=customlib -DCMAKE_INSTALL_INCLUDEDIR=custominclude \
            -DCMAKE_INSTALL_PREFIX="$package_prefix" -DCMAKE_INSTALL_RPATH="$runtime_origin/../lib" \
            "${instrumentation_flags[@]}"
          cmake --build build-install --parallel 4
          cmake --install build-install
          mv "$package_prefix" "$RUNNER_TEMP/linalg-package-moved"
          package_prefix="$RUNNER_TEMP/linalg-package-moved"
          # Copy the consumer outside the checkout; it must use installed headers/libraries.
          cp -R Testing/InstallConsumer "$RUNNER_TEMP/linalg-consumer"
          cmake -S "$RUNNER_TEMP/linalg-consumer" -B "$RUNNER_TEMP/linalg-consumer-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$package_prefix" \
            -DLinearAlgebra_DIR="$package_prefix/customlib/cmake/LinearAlgebra"
          cmake --build "$RUNNER_TEMP/linalg-consumer-build" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/linalg-consumer-build" --output-on-failure --no-tests=error

  bazel:
    name: Bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Test
        # Target only this repo's own tests, rather than a recursive //...
        # (which loads every package it can reach, including this repo's
        # own dependencies): a subtractive "//... -//ThirdParty/..." still
        # fails, since Bazel loads packages under an excluded pattern before
        # applying the exclusion — and vendored trees under ThirdParty/ (e.g.
        # Logging's own Google Benchmark submodule) pull in tooling this
        # workspace never registers and was never meant to build here.
        # ThirdParty/... is built only as a library dependency (via
        # //:LinearAlgebra), not run as a test suite — CMake's equivalent
        # add_subdirectory(ThirdParty/Logging) likewise builds it with its
        # own testing disabled.
        run: bazel test //Testing/...

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: native
          - os: ubuntu-latest
            backend: openblas
          - os: ubuntu-latest
            backend: mkl
          - os: macos-latest
            backend: native
          - os: windows-latest
            backend: native
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install OpenBLAS/LAPACKE
        if: matrix.backend == 'openblas'
        run: sudo apt-get install -y libopenblas-dev liblapacke-dev

      - name: Install Intel oneMKL
        if: matrix.backend == 'mkl'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLINALG_ENABLE_TESTING=ON
          -DLINALG_ENABLE_COVERAGE=ON
          -DLINALG_ENABLE_BLAS=${{ matrix.backend == 'openblas' && 'ON' || 'OFF' }}
          -DLINALG_ENABLE_MKL=${{ matrix.backend == 'mkl' && 'ON' || 'OFF' }}
          -DCMAKE_PREFIX_PATH=/opt/intel/oneapi/mkl/latest/lib/cmake/mkl

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -S . -B build
          -DLINALG_ENABLE_TESTING=ON
          -DLINALG_ENABLE_COVERAGE=ON

      - name: Verify coverage backend
        if: matrix.os != 'windows-latest'
        env:
          COVERAGE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          commands = json.loads(Path("build/compile_commands.json").read_text())
          command = next(entry["command"] for entry in commands if entry["file"].endswith("/src/matrix_operation/cpu/trace.cpp"))
          backend = os.environ["COVERAGE_BACKEND"]
          expected = {
              "LINALG_HAS_MKL": int(backend == "mkl"),
              "LINALG_HAS_BLAS": int(backend == "openblas"),
              "LINALG_HAS_LAPACKE": int(backend == "openblas"),
          }
          for macro, value in expected.items():
              assert f"-D{macro}={value}" in command, f"Expected {macro}={value} for {backend}"
          PYCODE

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.backend }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          flags: ${{ matrix.backend }}
          name: coverage-${{ matrix.os }}-${{ matrix.backend }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
